name: Local Capability Preservation

on:
  workflow_call:

permissions:
  contents: read

jobs:
  preserve:
    name: Preserve fork-local capabilities
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # 8.2.0
        with:
          version: "0.9.28"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install test dependencies
        run: uv sync --locked --python 3.11 --extra dev

      - name: Verify local capability contracts
        run: uv run python scripts/ci/check_local_capability_preservation.py

      - name: Run protected capability regressions
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t targets < <(
            uv run python scripts/ci/check_local_capability_preservation.py --print-pytest-targets
          )
          if [ "${#targets[@]}" -eq 0 ]; then
            echo "::error::local capability manifest contains no pytest targets"
            exit 1
          fi
          printf 'Protected regression targets:\n'
          printf '  %s\n' "${targets[@]}"
          scripts/run_tests.sh "${targets[@]}" -q --tb=short
